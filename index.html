<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Super AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg-main: #0b0d12;
      --bg-card: #151923;
      --bg-card-hover: #1e2433;
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --border: #232938;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-primary);
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: rgba(11, 13, 18, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      z-index: 25;
    }

    .icon-btn {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .model-selector {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 7px 14px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .model-selector:active {
      background: var(--bg-card-hover);
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .status-dot.offline {
      background: #ef4444;
      box-shadow: 0 0 8px rgba(239, 68, 68, 0.7);
    }

    .model-frame-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 20;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .model-frame-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .model-frame {
      position: fixed;
      top: 66px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      width: min(340px, calc(100vw - 24px));
      background: #141824;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      z-index: 30;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .model-frame.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .model-option {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 16px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-primary);
      text-align: left;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }

    .model-option:hover,
    .model-option:active {
      background: var(--bg-card-hover);
    }

    .model-option.active {
      background: rgba(99, 102, 241, 0.14);
      border-color: rgba(99, 102, 241, 0.45);
    }

    .model-option-icon {
      width: 22px;
      font-size: 16px;
      line-height: 22px;
      text-align: center;
      color: #a5b4fc;
      flex-shrink: 0;
    }

    .model-option-body {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .model-option-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .model-option-desc {
      font-size: 12.5px;
      line-height: 1.35;
      color: var(--text-secondary);
    }

    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
    }

    .hero {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .super-orb {
      width: 74px;
      height: 74px;
      border-radius: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 10px 30px var(--accent-glow);
      margin-bottom: 18px;
      transform: rotate(-4deg);
    }

    .hero h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
      color: #fff;
    }

    .hero p {
      font-size: 14px;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .quick-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 100%;
    }

    .quick-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      text-align: left;
      cursor: pointer;
    }

    .quick-card:active {
      background: var(--bg-card-hover);
    }

    .quick-card .emoji {
      font-size: 20px;
      margin-bottom: 8px;
      display: block;
    }

    .quick-card .q-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 3px;
    }

    .quick-card .q-sub {
      font-size: 11.5px;
      color: var(--text-secondary);
    }

    .messages {
      display: none;
      flex-direction: column;
      gap: 14px;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 85%;
    }

    .msg-row.user {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.ai {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      padding: 0 4px;
    }

    .msg-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14.5px;
      line-height: 1.5;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg-row.user .msg-bubble {
      background: linear-gradient(135deg, #4f46e5, #6366f1);
      color: #ffffff;
      border-bottom-right-radius: 4px;
    }

    .msg-row.ai .msg-bubble {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-primary);
      border-bottom-left-radius: 4px;
    }

    .gen-img-wrap {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .gen-img {
      width: 100%;
      max-width: 280px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
      background: #0b0d12;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .gen-video {
      width: 100%;
      max-width: 280px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: block;
      background: #0b0d12;
      aspect-ratio: 16 / 9;
    }

    .media-actions {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .save-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent);
      color: #fff;
      text-decoration: none;
      border: none;
      font-size: 13px;
      font-weight: 600;
      padding: 9px 12px;
      border-radius: 10px;
      text-align: center;
      cursor: pointer;
    }

    .save-btn.secondary {
      background: #1e2433;
      border: 1px solid var(--border);
      color: var(--text-primary);
    }

    .input-area {
      padding: 10px 14px 16px;
      background: var(--bg-main);
      border-top: 1px solid var(--border);
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 6px 8px 6px 14px;
      transition: opacity 0.2s, border-color 0.2s;
    }

    .input-wrapper.locked {
      opacity: 0.55;
      border-color: rgba(239, 68, 68, 0.45);
    }

    .input-wrapper input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 15px;
      padding: 8px 0;
    }

    .input-wrapper input:disabled {
      cursor: not-allowed;
    }

    .input-wrapper input::placeholder {
      color: var(--text-secondary);
    }

    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 14px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .action-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.6);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
    }

    .drawer-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 280px;
      background: #10131c;
      border-right: 1px solid var(--border);
      z-index: 50;
      padding: 18px;
      display: flex;
      flex-direction: column;
      transform: translateX(-100%);
      transition: transform 0.25s ease;
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .drawer-brand {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    .create-btn {
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(135deg, #4f46e5, #7c3aed);
      color: #fff;
      font-size: 14.5px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 14px;
    }

    .section-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .chat-history {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .history-entry {
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      color: var(--text-primary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid transparent;
    }

    .history-entry.active {
      background: var(--bg-card);
      border-color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="drawer-backdrop" id="backdrop" onclick="toggleDrawer(false)"></div>

  <aside class="drawer" id="drawer">
    <div class="drawer-top">
      <div class="drawer-brand">Super AI</div>
      <button class="icon-btn" onclick="toggleDrawer(false)">✕</button>
    </div>

    <button class="create-btn" onclick="startNewChat()">+ Новый диалог</button>

    <div class="section-label">Недавние чаты</div>
    <div class="chat-history" id="historyList"></div>
  </aside>

  <div class="model-frame-backdrop" id="modelFrameBackdrop" onclick="toggleModelFrame(false)"></div>
  <div class="model-frame" id="modelFrame" role="dialog" aria-label="Выбор модели"></div>

  <header class="header">
    <button class="icon-btn" onclick="toggleDrawer(true)">☰</button>
    <div class="model-selector" onclick="toggleModelFrame()" title="Нажми, чтобы выбрать модель">
      <span class="status-dot" id="statusDot"></span>
      <span id="modelName">Super Photo</span>
      <span style="font-size: 11px; color: var(--text-secondary);">▼</span>
    </div>
    <button class="icon-btn" onclick="startNewChat()" title="Новый чат">➕</button>
  </header>

  <main class="chat-container" id="chatContainer">
    <div class="hero" id="heroScreen">
      <div class="super-orb">S</div>
      <h1>Привет, я Super</h1>
      <p>Выбери модель вверху или нажми карточку ниже</p>

      <div class="quick-grid">
        <div class="quick-card" id="quickCard" onclick="quickAsk('Сделай 18+ картинку')">
          <span class="emoji">🔞</span>
          <div class="q-title" id="quickTitle">Сделай 18+ картинку</div>
          <div class="q-sub" id="quickSub">Генерация изображения</div>
        </div>
      </div>
    </div>

    <div class="messages" id="messages"></div>
  </main>

  <footer class="input-area">
    <div class="input-wrapper" id="inputWrapper">
      <input
        type="text"
        id="userInput"
        placeholder="Опиши фото для генерации..."
        onkeydown="if(event.key==='Enter') sendMsg()"
      />
      <button class="action-btn" id="sendBtn" onclick="sendMsg()">➤</button>
    </div>
  </footer>

  <script>
    const PERSONAL_IMAGES = [
      "https://i.postimg.cc/VNDHbVHM/IMG-a0b3324c-123c-4719-a23f-91db4dcbf084.jpg",
      "https://i.postimg.cc/V5Q78Q5r/IMG-ffeae16e-7e35-4dfd-8e9b-4646caf7d9d3.jpg",
      "https://i.postimg.cc/VNDHbVHM/IMG-a0b3324c-123c-4719-a23f-91db4dcbf084.jpg",
      "https://i.postimg.cc/JhzCgJfB/IMG-0e76611e-2375-4756-a493-c02a4a640caa.jpg",
      "https://i.postimg.cc/D0s9scXP/IMG-e5e3ae20-e48a-43e7-b765-e91ef07bbb82.jpg",
      "https://i.postimg.cc/V5Q78Q5r/IMG-ffeae16e-7e35-4dfd-8e9b-4646caf7d9d3.jpg",
      "https://i.postimg.cc/LsvJTSvY/IMG-874ff486-9292-4e72-bd4d-3980e05d36ae.jpg",
      "https://i.postimg.cc/3rzFpjdZ/IMG-f02a9238-286d-4b6f-9d71-14aa10c6a468.jpg",
      "https://i.postimg.cc/g0cVdNT3/IMG-b58e6b96-4555-4079-accb-0026918bc97d.jpg",
      "https://i.postimg.cc/Xq5Fxhp1/IMG-ed3cb263-7e8b-425f-9e39-30a989077b56.jpg"
    ];

    const PERSONAL_VIDEOS = [
      "https://denis2610kak-lgtm.github.io/Video-1/Video.Guru_20261124-193410845-compressed.mp4"
    ];

    const MODELS = [
      {
        id: 'photo',
        name: 'Super Photo',
        desc: 'он может фото 18+ делать'
      },
      {
        id: 'video',
        name: 'Super Video',
        desc: 'он может сделать видео 18+'
      }
    ];
    let currentModelIdx = 0;

    const GENERATED_CAPTIONS = [
      "Готово! Вот что я сгенерировал по твоему запросу:",
      "Картинка создана! Смотри результат:",
      "Сгенерировал изображение специально для тебя:",
      "Готово! Вот результат генерации:"
    ];

    const VIDEO_CAPTIONS = [
      "Готово! Вот видео по твоему запросу:",
      "Видео сгенерировано! Смотри плеер ниже:",
      "Готовый клип готов к просмотру:"
    ];

    const STORAGE_KEY = 'super_local_sessions_v3';
    let sessions = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    let currentSessionId = null;

    let isChatEnabled = true;
    let isSending = false;
    let isModelFrameOpen = false;

    const drawer = document.getElementById('drawer');
    const backdrop = document.getElementById('backdrop');
    const modelFrame = document.getElementById('modelFrame');
    const modelFrameBackdrop = document.getElementById('modelFrameBackdrop');
    const heroScreen = document.getElementById('heroScreen');
    const quickCard = document.getElementById('quickCard');
    const quickTitle = document.getElementById('quickTitle');
    const quickSub = document.getElementById('quickSub');
    const messages = document.getElementById('messages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const inputWrapper = document.getElementById('inputWrapper');
    const statusDot = document.getElementById('statusDot');
    const modelNameEl = document.getElementById('modelName');
    const historyList = document.getElementById('historyList');
    const chatContainer = document.getElementById('chatContainer');

    function getCurrentModel() {
      return MODELS[currentModelIdx];
    }

    function updateQuickCard() {
      const isVideo = getCurrentModel().id === 'video';
      const promptText = isVideo ? 'Сделай 18+ видео' : 'Сделай 18+ картинку';
      quickTitle.textContent = promptText;
      quickSub.textContent = isVideo ? 'Генерация видео' : 'Генерация изображения';
      quickCard.onclick = () => quickAsk(promptText);
    }

    function renderModelFrame() {
      modelFrame.innerHTML = '';
      MODELS.forEach((m, idx) => {
        const isActive = idx === currentModelIdx;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'model-option' + (isActive ? ' active' : '');
        btn.onclick = () => selectModel(idx);

        const icon = document.createElement('span');
        icon.className = 'model-option-icon';
        icon.textContent = isActive ? '✓' : '';

        const body = document.createElement('div');
        body.className = 'model-option-body';

        const title = document.createElement('div');
        title.className = 'model-option-title';
        title.textContent = m.name;

        const desc = document.createElement('div');
        desc.className = 'model-option-desc';
        desc.textContent = m.desc;

        body.appendChild(title);
        body.appendChild(desc);
        btn.appendChild(icon);
        btn.appendChild(body);
        modelFrame.appendChild(btn);
      });
    }

    function toggleModelFrame(forceState) {
      if (isSending) return;
      isModelFrameOpen = typeof forceState === 'boolean' ? forceState : !isModelFrameOpen;
      if (isModelFrameOpen) {
        renderModelFrame();
      }
      modelFrame.classList.toggle('open', isModelFrameOpen);
      modelFrameBackdrop.classList.toggle('open', isModelFrameOpen);
    }

    function selectModel(idx) {
      currentModelIdx = idx;
      modelNameEl.textContent = getCurrentModel().name;
      updateQuickCard();
      updateInputState();
      toggleModelFrame(false);
    }

    function updateInputState() {
      const locked = !isChatEnabled || isSending;
      userInput.disabled = locked;
      sendBtn.disabled = locked;
      inputWrapper.classList.toggle('locked', !isChatEnabled);
      statusDot.classList.toggle('offline', !isChatEnabled);

      if (!isChatEnabled) {
        userInput.placeholder = "Чат сейчас не работает...";
      } else if (isSending) {
        userInput.placeholder = "Подожди, формирую ответ...";
      } else if (getCurrentModel().id === 'video') {
        userInput.placeholder = "Опиши видео для генерации...";
      } else {
        userInput.placeholder = "Опиши фото для генерации...";
      }
    }

    function setChatEnabled(enabled) {
      isChatEnabled = Boolean(enabled);
      updateInputState();
    }

    document.addEventListener("DOMContentLoaded", () => {
      modelNameEl.textContent = getCurrentModel().name;
      renderHistory();
      renderModelFrame();
      updateQuickCard();
      updateInputState();
    });

    function toggleDrawer(show) {
      if (show) toggleModelFrame(false);
      drawer.classList.toggle('open', show);
      backdrop.classList.toggle('open', show);
    }

    function startNewChat() {
      toggleModelFrame(false);
      currentSessionId = null;
      messages.innerHTML = '';
      messages.style.display = 'none';
      heroScreen.style.display = 'flex';
      renderHistory();
      toggleDrawer(false);
    }

    function quickAsk(text) {
      if (!isChatEnabled || isSending) return;
      toggleModelFrame(false);
      toggleDrawer(false);
      userInput.value = text;
      sendMsg();
    }

    async function triggerDownload(url, filename) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename || 'video.mp4';
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(blobUrl), 2000);
      } catch (e) {
        window.open(url, '_blank', 'noopener,noreferrer');
      }
    }

    function createBubbleElement(msg) {
      const row = document.createElement('div');
      row.className = `msg-row ${msg.role}`;

      const sender = document.createElement('div');
      sender.className = 'msg-sender';
      sender.textContent = msg.role === 'user' ? 'Вы' : (msg.modelName || 'Super');

      const bubble = document.createElement('div');
      bubble.className = 'msg-bubble';
      bubble.textContent = msg.text;

      if (msg.imageUrl) {
        const wrap = document.createElement('div');
        wrap.className = 'gen-img-wrap';

        const img = new Image();
        img.className = 'gen-img';
        img.src = msg.imageUrl;

        const btn = document.createElement('a');
        btn.className = 'save-btn';
        btn.href = msg.imageUrl;
        btn.target = '_blank';
        btn.textContent = '📥 Открыть / Скачать фото';

        wrap.appendChild(img);
        wrap.appendChild(btn);
        bubble.appendChild(wrap);
      }

      if (msg.videoUrl) {
        const wrap = document.createElement('div');
        wrap.className = 'gen-img-wrap';

        const video = document.createElement('video');
        video.className = 'gen-video';
        video.src = msg.videoUrl;
        video.controls = true;
        video.playsInline = true;

        const actions = document.createElement('div');
        actions.className = 'media-actions';

        const openBtn = document.createElement('a');
        openBtn.className = 'save-btn';
        openBtn.href = msg.videoUrl;
        openBtn.target = '_blank';
        openBtn.rel = 'noopener noreferrer';
        openBtn.textContent = '🎬 Открыть видео';

        const dlBtn = document.createElement('button');
        dlBtn.type = 'button';
        dlBtn.className = 'save-btn secondary';
        dlBtn.textContent = '📥 Скачать видео';
        dlBtn.onclick = () => triggerDownload(msg.videoUrl, 'super-video.mp4');

        actions.appendChild(openBtn);
        actions.appendChild(dlBtn);
        wrap.appendChild(video);
        wrap.appendChild(actions);
        bubble.appendChild(wrap);
      }

      row.appendChild(sender);
      row.appendChild(bubble);
      return { row, bubble };
    }

    function saveSessions() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(sessions));
      renderHistory();
    }

    function openSession(sessionId) {
      const session = sessions.find(s => s.id === sessionId);
      if (!session) return;

      toggleModelFrame(false);
      currentSessionId = sessionId;
      heroScreen.style.display = 'none';
      messages.style.display = 'flex';
      messages.innerHTML = '';

      session.messages.forEach(msg => {
        const { row } = createBubbleElement(msg);
        messages.appendChild(row);
      });

      chatContainer.scrollTop = chatContainer.scrollHeight;
      renderHistory();
      toggleDrawer(false);
    }

    function renderHistory() {
      historyList.innerHTML = '';

      if (sessions.length === 0) {
        historyList.innerHTML = '<div style="font-size: 12px; color: #94a3b8; padding: 6px;">История пуста</div>';
        return;
      }

      sessions.forEach(session => {
        const div = document.createElement('div');
        div.className = 'history-entry' + (session.id === currentSessionId ? ' active' : '');
        div.textContent = session.title;
        div.onclick = () => openSession(session.id);
        historyList.appendChild(div);
      });
    }

    function sendMsg() {
      if (!isChatEnabled || isSending) return;

      const text = userInput.value.trim();
      if (!text) return;

      toggleModelFrame(false);
      const model = getCurrentModel();
      isSending = true;
      updateInputState();

      heroScreen.style.display = 'none';
      messages.style.display = 'flex';
      userInput.value = '';

      const mode = model.id === 'video' ? 'video' : 'photo';
      const prefixIcon = mode === 'video' ? '🎬 ' : '🖼️ ';

      if (!currentSessionId) {
        currentSessionId = Date.now().toString();
        sessions.unshift({
          id: currentSessionId,
          title: prefixIcon + text,
          messages: []
        });
        if (sessions.length > 15) sessions.pop();
      }

      const activeSession = sessions.find(s => s.id === currentSessionId);

      const userMsg = { role: 'user', text: text };
      activeSession.messages.push(userMsg);
      messages.appendChild(createBubbleElement(userMsg).row);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      saveSessions();

      const pendingText = mode === 'video' ? 'Генерирую видео...' : 'Генерирую изображение...';

      const tempRow = createBubbleElement({
        role: 'ai',
        modelName: model.name,
        text: pendingText
      }).row;
      messages.appendChild(tempRow);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      setTimeout(() => {
        tempRow.remove();

        let aiMsg;
        if (mode === 'video') {
          const videoIndex = Math.floor(Math.random() * PERSONAL_VIDEOS.length);
          const captionIndex = Math.floor(Math.random() * VIDEO_CAPTIONS.length);
          aiMsg = {
            role: 'ai',
            modelName: model.name,
            text: VIDEO_CAPTIONS[captionIndex],
            videoUrl: PERSONAL_VIDEOS[videoIndex]
          };
        } else {
          const randomIndex = Math.floor(Math.random() * PERSONAL_IMAGES.length);
          const captionIndex = Math.floor(Math.random() * GENERATED_CAPTIONS.length);
          aiMsg = {
            role: 'ai',
            modelName: model.name,
            text: GENERATED_CAPTIONS[captionIndex],
            imageUrl: PERSONAL_IMAGES[randomIndex]
          };
        }

        activeSession.messages.push(aiMsg);
        messages.appendChild(createBubbleElement(aiMsg).row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
        saveSessions();

        isSending = false;
        updateInputState();
      }, 350);
    }
  </script>
</body>
</html>
